                                handle.dataset.handle = pos;
                                handle.style.position = 'absolute'; handle.style.width = '10px'; handle.style.height = '10px';
                                handle.style.backgroundColor = 'var(--primary-color)'; handle.style.border = '1px solid white';
                                if (pos.includes('n')) handle.style.top = '-5px';
                                if (pos.includes('s')) handle.style.bottom = '-5px';
                                if (pos.includes('w')) handle.style.left = '-5px';
                                if (pos.includes('e')) handle.style.right = '-5px';
                                handle.style.cursor = `${pos}-resize`; handle.style.zIndex = '25';
                                el.appendChild(handle);
                            });
                        }
                    }
                    annotationLayer.appendChild(el);
                });

                if (state.pendingTextPin) renderPinMarker();
            } catch (e) {
                console.error('Fatal error in renderAnnotations:', e);
            }
        }

        function renderSidebar() {
            commentList.innerHTML = '';
            if (state.annotations.length === 0) {
                commentList.innerHTML = '<li class="sidebar-item-empty">注釈はまだありません</li>';
                return;
            }
            state.annotations.sort((a, b) => a.pageNumber - b.pageNumber || a.yPct - b.yPct).forEach(ann => {
                const li = document.createElement('li');
                li.className = 'sidebar-item';
                if (state.selectedAnnotationId === ann.id) li.classList.add('selected');
                let content = '', icon = '';
                if (ann.type === 'point') {
                    const shape = ann.shape || 'dot';
                    let shapeIcon = '●', shapeName = '点';
                    if (shape === 'circle') { shapeIcon = '○'; shapeName = '円'; }
                    if (shape === 'cross') { shapeIcon = '×'; shapeName = 'バツ'; }
                    if (shape === 'question') { shapeIcon = '？'; shapeName = '？'; }
                    content = shapeName; icon = shapeIcon;
                } else if (ann.type === 'text') { content = ann.text || '(空のテキスト)'; icon = 'T'; }
                else if (ann.type === 'draw') { content = '手書き'; icon = 'P'; }
                else if (ann.type === 'highlight') { content = ann.comment || 'ハイライト'; icon = 'H'; }
                else if (ann.type === 'whiteout') { content = ann.comment || 'ホワイトアウト'; icon = 'W'; }
                else if (ann.type === 'stamp') {
                    let text = ann.stampType.toUpperCase();
                    if (ann.stampType === 'review') text = '要確認';
                    if (ann.stampType === 'fix') text = '修正';
                    content = text; icon = 'S';
                } else if (ann.type === 'image') { content = '画像'; icon = 'I'; }
                li.innerHTML = `
                    <div class="sidebar-item-header">
                        <span>P.${ann.pageNumber} [${icon}]</span>
                        <button class="sidebar-delete-btn" onclick="event.stopPropagation(); deleteAnnotation('${ann.id}')">×</button>
                    </div>
                    <div class="sidebar-item-content">${content}</div>`;
                li.onclick = () => {
                    if (state.pageNum !== ann.pageNumber) {
                        state.pageNum = ann.pageNumber;
                        renderPage(state.pageNum);
                        setTimeout(() => highlightAnnotation(ann.id), 100);
                    } else { highlightAnnotation(ann.id); }
                    selectAnnotation(ann.id);
                };
                commentList.appendChild(li);
            });
        }

        function highlightAnnotation(id) {
            const el = document.querySelector(`.annotation[data-id="${id}"]`);
            if (el) { el.classList.remove('highlighted'); void el.offsetWidth; el.classList.add('highlighted'); }
        }

        function pushState() {
            state.undoStack.push(JSON.stringify(state.annotations));
            state.redoStack = [];
            updateUndoRedoButtons();
        }

        function undo() {
            if (state.undoStack.length === 0) return;
            state.redoStack.push(JSON.stringify(state.annotations));
            state.annotations = JSON.parse(state.undoStack.pop());
            renderAnnotations(); renderSidebar(); updateUndoRedoButtons();
        }

        function redo() {
            if (state.redoStack.length === 0) return;
            state.undoStack.push(JSON.stringify(state.annotations));
            state.annotations = JSON.parse(state.redoStack.pop());
            renderAnnotations(); renderSidebar(); updateUndoRedoButtons();
        }

        function updateUndoRedoButtons() {
            undoBtn.disabled = state.undoStack.length === 0;
            redoBtn.disabled = state.redoStack.length === 0;
        }

        function exportCSV() {
            const headers = ['id', 'type', 'pageNumber', 'xPct', 'yPct', 'widthPct', 'heightPct', 'color', 'size', 'content', 'stampType', 'font', 'shape', 'points'];
            const rows = state.annotations.map(a => [
                a.id, a.type, a.pageNumber, a.xPct.toFixed(4), a.yPct.toFixed(4),
                a.wPct ? a.wPct.toFixed(4) : '', a.hPct ? a.hPct.toFixed(4) : '',
                a.color || '', a.size || '', (a.text || a.comment || '').replace(/"/g, '""'),
                a.stampType || '', a.font || '', a.shape || '',
                a.points ? JSON.stringify(a.points).replace(/"/g, '""') : ''
            ]);
            const csvContent = [headers.join(','), ...rows.map(row => row.map(cell => `"${cell}"`).join(','))].join('\n');
            const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `annotations_${Date.now()}.csv`;
            link.click();
        }

        function getEventPos(e) {
            if (e.touches && e.touches.length > 0) return { clientX: e.touches[0].clientX, clientY: e.touches[0].clientY };
            if (e.changedTouches && e.changedTouches.length > 0) return { clientX: e.changedTouches[0].clientX, clientY: e.changedTouches[0].clientY };
            return { clientX: e.clientX, clientY: e.clientY };
        }

        function dispatchMouseLike(target, type, pos) {
            target.dispatchEvent(new MouseEvent(type, {
                bubbles: true,
                cancelable: true,
                view: window,
                clientX: pos.clientX,
                clientY: pos.clientY
            }));
        }

        function distanceBetweenTouches(touches) {
            var dx = touches[0].clientX - touches[1].clientX;
            var dy = touches[0].clientY - touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        var _penStartPos = null;
        var _penTarget = null;
        var _penMoved = false;

        annotationLayer.addEventListener('pointerdown', function(e) {
            if (e.pointerType !== 'pen') return;
            e.preventDefault();
            annotationLayer.setPointerCapture(e.pointerId);
            _penStartPos = { clientX: e.clientX, clientY: e.clientY };
            _penTarget = e.target;
            _penMoved = false;
            state.suppressTouchPanUntil = Date.now() + 1000;
            dispatchMouseLike(e.target, 'mousedown', e);
        }, { passive: false });

        annotationLayer.addEventListener('pointermove', function(e) {
            if (e.pointerType !== 'pen' || !_penStartPos) return;
            e.preventDefault();
            var dx = e.clientX - _penStartPos.clientX;
            var dy = e.clientY - _penStartPos.clientY;
            if (Math.sqrt(dx * dx + dy * dy) >= 8) _penMoved = true;
            state.suppressTouchPanUntil = Date.now() + 1000;
            dispatchMouseLike(annotationLayer, 'mousemove', e);
        }, { passive: false });

        annotationLayer.addEventListener('pointerup', function(e) {
            if (e.pointerType !== 'pen' || !_penStartPos) return;
            e.preventDefault();
            dispatchMouseLike(annotationLayer, 'mouseup', e);
            if (!_penMoved) {
                handleAnnotationTap({
                    target: _penTarget || e.target,
                    clientX: e.clientX,
                    clientY: e.clientY
                });
            }
            state.ignoreMouseClickUntil = Date.now() + 500;
            state.suppressTouchPanUntil = Date.now() + 500;
            _penStartPos = null;
            _penTarget = null;
            _penMoved = false;
        }, { passive: false });

        annotationLayer.addEventListener('pointercancel', function(e) {
            if (e.pointerType !== 'pen') return;
            dispatchMouseLike(annotationLayer, 'mouseup', e);
            state.suppressTouchPanUntil = Date.now() + 500;
            _penStartPos = null;
            _penTarget = null;
            _penMoved = false;
        });

        var _touchGesture = null;
        var _stylusTouch = null;
        var _lastTapTime = 0;
        var _lastTapTarget = null;

        annotationLayer.addEventListener('touchstart', function(e) {
            if (e.target.closest('input, textarea, select, button, label')) return;
            if (!_penStartPos && e.touches.length === 1 && e.touches[0].touchType === 'stylus') {
                e.preventDefault();
                var stylus = e.touches[0];
                _stylusTouch = {
                    target: e.target,
                    startX: stylus.clientX,
                    startY: stylus.clientY,
                    moved: false
                };
                state.suppressTouchPanUntil = Date.now() + 1000;
                dispatchMouseLike(e.target, 'mousedown', stylus);
                return;
            }

            if (e.touches.length >= 2) {
                e.preventDefault();
                _touchGesture = {
                    type: 'pinch',
                    startDistance: distanceBetweenTouches(e.touches),
                    startZoom: state.zoomFactor,
                    changed: false
                };
                return;
            }

            if (state.isDrawing || state.isErasing || Date.now() < state.suppressTouchPanUntil || state.mode === 'draw' || state.mode === 'erase') {
                e.preventDefault();
                _touchGesture = null;
                return;
            }

            var t = e.touches[0];
            e.preventDefault();
            _touchGesture = {
                type: 'pan-or-tap',
                target: e.target,
                startX: t.clientX,
                startY: t.clientY,
                lastX: t.clientX,
                lastY: t.clientY,
                scrollLeft: viewerContainer.scrollLeft,
                scrollTop: viewerContainer.scrollTop,
                moved: false
            };
        }, { passive: false });

        annotationLayer.addEventListener('touchmove', function(e) {
            if (_stylusTouch) {
                e.preventDefault();
                var stylus = Array.from(e.touches).find(t => t.touchType === 'stylus') || e.touches[0];
                if (!stylus) return;
                var stylusDx = stylus.clientX - _stylusTouch.startX;
                var stylusDy = stylus.clientY - _stylusTouch.startY;
                if (Math.sqrt(stylusDx * stylusDx + stylusDy * stylusDy) >= 8) _stylusTouch.moved = true;
                state.suppressTouchPanUntil = Date.now() + 1000;
                dispatchMouseLike(annotationLayer, 'mousemove', stylus);
                return;
            }

            if (!_touchGesture) return;
            if (state.isDrawing || state.isErasing || Date.now() < state.suppressTouchPanUntil || state.mode === 'draw' || state.mode === 'erase') {
                e.preventDefault();
                _touchGesture = null;
                return;
            }
            e.preventDefault();

            if (e.touches.length >= 2) {
                if (_touchGesture.type !== 'pinch') {
                    _touchGesture = {
                        type: 'pinch',
                        startDistance: distanceBetweenTouches(e.touches),
                        startZoom: state.zoomFactor,
                        changed: false
                    };
                }
                var ratio = distanceBetweenTouches(e.touches) / _touchGesture.startDistance;
                state.zoomFactor = Math.max(0.25, Math.min(4.0, parseFloat((_touchGesture.startZoom * ratio).toFixed(2))));
                updateZoomDisplay();
                _touchGesture.changed = true;
                return;
            }

            if (_touchGesture.type === 'pan-or-tap' && e.touches.length === 1) {
                var t = e.touches[0];
                var dx = t.clientX - _touchGesture.startX;
                var dy = t.clientY - _touchGesture.startY;
                if (Math.sqrt(dx * dx + dy * dy) >= 8) _touchGesture.moved = true;
                viewerContainer.scrollLeft = _touchGesture.scrollLeft - dx;
                viewerContainer.scrollTop = _touchGesture.scrollTop - dy;
                _touchGesture.lastX = t.clientX;
                _touchGesture.lastY = t.clientY;
            }
        }, { passive: false });

        annotationLayer.addEventListener('touchend', function(e) {
            if (_stylusTouch) {
                e.preventDefault();
                var stylus = Array.from(e.changedTouches).find(t => t.touchType === 'stylus') || e.changedTouches[0];
                if (!stylus) return;
                dispatchMouseLike(annotationLayer, 'mouseup', stylus);
                if (!_stylusTouch.moved) {
                    handleAnnotationTap({
                        target: _stylusTouch.target,
                        clientX: stylus.clientX,
                        clientY: stylus.clientY
                    });
                }
                _stylusTouch = null;
                state.ignoreMouseClickUntil = Date.now() + 500;
                state.suppressTouchPanUntil = Date.now() + 500;
                return;
            }

            if (!_touchGesture) return;
            e.preventDefault();

            if (_touchGesture.type === 'pinch') {
                if (_touchGesture.changed && state.pdfDoc) renderPage(state.pageNum);
                _touchGesture = null;
                state.ignoreMouseClickUntil = Date.now() + 500;
                return;
            }

            if (_touchGesture.type === 'pan-or-tap' && !_touchGesture.moved) {
                var now = Date.now();
                var tapEvent = {
                    target: _touchGesture.target,
                    clientX: _touchGesture.lastX,
                    clientY: _touchGesture.lastY
                };

                if (now - _lastTapTime < 300 && _lastTapTarget === _touchGesture.target) {
                    dispatchMouseLike(_touchGesture.target, 'dblclick', tapEvent);
                    _lastTapTime = 0;
                    _lastTapTarget = null;
                } else {
                    _lastTapTime = now;
                    _lastTapTarget = _touchGesture.target;
                    handleAnnotationTap(tapEvent);
                }
            }

            _touchGesture = null;
            state.ignoreMouseClickUntil = Date.now() + 500;
        }, { passive: false });

        annotationLayer.addEventListener('touchcancel', function() {
            _stylusTouch = null;
            _touchGesture = null;
            state.ignoreMouseClickUntil = Date.now() + 500;
            state.suppressTouchPanUntil = Date.now() + 500;
        });

        var zoomInBtn = document.getElementById('zoom-in-btn');
        var zoomOutBtn = document.getElementById('zoom-out-btn');
        var zoomFitBtn = document.getElementById('zoom-fit-btn');
        var zoomDisplay = document.getElementById('zoom-level-display');

        function updateZoomDisplay() { zoomDisplay.textContent = Math.round(state.zoomFactor * 100) + '%'; }

        zoomInBtn.addEventListener('click', function () {
            state.zoomFactor = Math.min(parseFloat((state.zoomFactor + 0.25).toFixed(2)), 4.0);
            updateZoomDisplay(); if (state.pdfDoc) renderPage(state.pageNum);
        });
        zoomOutBtn.addEventListener('click', function () {
            state.zoomFactor = Math.max(parseFloat((state.zoomFactor - 0.25).toFixed(2)), 0.25);
            updateZoomDisplay(); if (state.pdfDoc) renderPage(state.pageNum);
        });
        zoomFitBtn.addEventListener('click', function () {
            state.zoomFactor = 1.0; updateZoomDisplay(); if (state.pdfDoc) renderPage(state.pageNum);
        });

        if (window.matchMedia('(pointer: coarse)').matches) {
            var msg = document.getElementById('drop-zone-msg');
            if (msg) msg.textContent = 'PDFファイルを選択してください';
        }

        var toggleBtn = document.getElementById('sidebar-toggle-btn');
        var overlay = document.getElementById('sidebar-overlay');
        var sidebar = document.getElementById('sidebar');
        toggleBtn.addEventListener('click', function () {
            var isOpen = sidebar.classList.toggle('sidebar-open');
            overlay.classList.toggle('active', isOpen);
        });
        overlay.addEventListener('click', function () {
            sidebar.classList.remove('sidebar-open');
            overlay.classList.remove('active');
        });
    </script>
</body>
